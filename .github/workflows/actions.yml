name: actions
on:
  push:
    branches:
      - master
    paths:
      - containers/**
      - .github/workflows/actions.yml
      - "*.sh"
  pull_request:
    branches:
      - master
    paths:
      - containers/**
      - .github/workflows/actions.yml
      - "*.sh"
  workflow_dispatch:
jobs:
  qemu-user-static:
    runs-on: ubuntu-latest
    env:
      VERSION: 11.1.2-1
      ORIGIN_VERSION: 11.1.2+ds-3
      ORIGIN_SHA256: 4bacc2bf647f1756c5f08e7f146161d3eeef9d9f53e5d6412d1b3daca0c93655
      DOCKER_REPO: polyarch/qemu-user-static
    steps:
      - uses: actions/checkout@v4
      - name: Set variables
        run: |
          echo "DOCKER_REPO=$DOCKER_REPO" >> $GITHUB_ENV
      - name: Build
        run: |
          wget -O qemu-user_${{ env.ORIGIN_VERSION }}_amd64.deb https://snapshot.debian.org/archive/debian/20261009T083023Z/pool/main/q/qemu/qemu-user_${{ env.ORIGIN_VERSION }}_amd64.deb
          echo "${{ env.ORIGIN_SHA256 }}  qemu-user_${{ env.ORIGIN_VERSION }}_amd64.deb" | sha256sum -c -
          dpkg-deb -v -R qemu-user_*.deb releases
          for f in releases/usr/bin/qemu-*; do if [ -L "$f" ]; then cp --remove-destination "$(readlink -f "$f")" "$f"; fi; done
          for f in releases/usr/bin/qemu-*; do mv "$f" "$f-static"; done
          ./run.sh -t "${{ env.VERSION }}" -r "${{ env.GITHUB_REPOSITORY }}" -d "${{ env.DOCKER_REPO }}"
      - name: Test
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}
          ./test.sh -d "${{ env.DOCKER_REPO }}"
      - name: Publish
        if: github.ref == 'refs/heads/master'
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}
          docker push --all-tags ${{ env.DOCKER_REPO }}
      - name: Create Release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          name: "v${{ env.VERSION }}"
          tag: "v${{ env.VERSION }}"
          body: |
            # `qemu-*-static` @ ${{ env.VERSION }}
          artifacts: "releases/usr/bin/*.tar.gz,releases/usr/bin/qemu-*-static"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
